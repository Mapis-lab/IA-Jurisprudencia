<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Búsqueda de Jurisprudencia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe2;--card:#fffdf8;--ink:#3b2a1d;--mid:#7a5a3c;--gold:#b98a3e;--line:#e2d3b8;--soft:#efe4cd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241b14;--card:#31251b;--ink:#f3e8d4;--mid:#d0b48c;--gold:#d9a94f;--line:#4d3b2a;--soft:#3b2d20}}
:root[data-theme="dark"]{--bg:#241b14;--card:#31251b;--ink:#f3e8d4;--mid:#d0b48c;--gold:#d9a94f;--line:#4d3b2a;--soft:#3b2d20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0 0 .4em}
h1{font-size:clamp(34px,5vw,54px);line-height:1.05}h2{font-size:32px}h3{font-size:21px}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--mid);background:transparent;color:var(--ink);padding:9px 20px}
button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}button.g{background:var(--gold);border-color:var(--gold);color:#fff}
button:hover{opacity:.85}
nav.top{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
nav.top .l{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:700}nav.top a{margin-left:22px;cursor:pointer;color:var(--mid)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding:6vh 5vw}
@media(max-width:800px){.hero{grid-template-columns:1fr}.side{display:none}.wrap{padding:16px!important}}
.hero p{max-width:520px;color:var(--mid)}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.box{max-width:400px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;text-align:center}
input,textarea{width:100%;padding:11px 14px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--soft);border-right:1px solid var(--line);padding:22px 14px}
.side .l{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin-bottom:18px}
.side a{display:block;padding:10px 14px;border-radius:12px;cursor:pointer;color:var(--mid)}.side a.on,.side a:hover{background:var(--card);color:var(--ink);font-weight:600}
.wrap{padding:30px 4vw;max-width:1050px}.top2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.av{width:38px;height:38px;border:2px solid var(--mid);border-radius:50%;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}
.drop{border:2px dashed var(--gold);border-radius:18px;padding:16px;text-align:center;color:var(--mid);margin:12px 0}
.tag{display:inline-block;font-size:12px;padding:2px 11px;border-radius:99px;background:var(--soft);color:var(--mid);margin:3px 4px 0 0;border:1px solid var(--line)}
.demo{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:0 6px;margin-left:6px;white-space:nowrap}
.pct{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold);font-weight:700}
.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mid),var(--gold));border-radius:9px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0;flex-wrap:wrap}
.tabs b{padding:9px 18px;cursor:pointer;border:1px solid transparent;border-radius:12px 12px 0 0;color:var(--mid);font-weight:600;font-size:13px;letter-spacing:.05em}
.tabs b.on{background:var(--card);border-color:var(--line);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.src{font-size:12.5px;color:var(--mid)}.src a{color:var(--gold)}
.acc{cursor:pointer}.acc .h{display:flex;align-items:center;gap:14px;justify-content:space-between}.acc .b{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.acc.open .b{display:block}
.st{display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--mid);opacity:.3;transition:.4s}.st.on{opacity:1;color:var(--ink)}.st span{color:var(--gold);font-weight:700}
.flt{display:flex;gap:8px;flex-wrap:wrap}.flt select{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px}
.q{cursor:pointer;padding:10px 0;border-bottom:1px solid var(--line)}
.modal{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:99px;z-index:9}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script></head><body><div id="r"></div>
<script>
const M={n:"Sentencia 43556 de 2018",c:"Consejo de Estado · Sección Tercera",f:"30 de mayo de 2018",mag:"Ramiro Pazos Guerrero (C.P.)",rad:"76001-23-31-000-2003-04969-01 (43556)",t:"Reparación directa"};
const SRC={a:["Ámbito Jurídico – reseña de la sentencia","https://www.ambitojuridico.com/noticias/administrativo/administrativo-y-contratacion/quien-responde-por-un-accidente-de-transito"],j:["Jurinfo (JEP) – compilación Consejo de Estado, Sección Tercera","https://jurinfo.jep.gov.co/normograma/compilacion/jsacaepjdarrespondestado_pfeeservic_accidedtransijurispcde_ays_consejo_estado_seccion_tercera.html"],j2:["Jurinfo (JEP) – compilación Consejo de Estado, Sección Tercera","https://jurinfo.jep.gov.co/normograma/compilacion/jsaadljjdarrespondestado_pfeeservic_accidedtransijurispcde_ays_consejo_estado_seccion_tercera.html"],ab:["Ámbito Jurídico – reseña de la sentencia","https://www.ambitojuridico.com/noticias/administrativo/administrativo-y-contratacion/falla-del-servicio-es-indispensable-para"]};
const R=[
{n:"Sentencia 43556 de 2018",y:2018,c:"Consejo de Estado",p:94,tags:["Falla del servicio","Señalización","Invías"],w:"Accidente por mal estado vial y falta de señalización; se exige probar daño y falla del servicio. Absolvió al municipio y declaró responsable a Invías en 50 %.",s:[91,95,88,82,90,87],rad:M.rad,f:M.f,mag:M.mag,src:SRC.a},
{n:"Sentencia 30799 de 2014",y:2014,c:"Consejo de Estado",p:89,tags:["Señalización","Derrumbes","Invías"],w:"Invías responde por no instalar la señalización preventiva reglamentaria ante riesgo de derrumbes en la vía Sandoná–Pasto.",s:[84,90,86,70,88,85],rad:"05001-23-31-000-2000-01035-01 (30799)",f:"29 de mayo de 2014",mag:"Ver texto oficial",src:SRC.ab},
{n:"Sentencia 61781 de 2021",y:2021,c:"Consejo de Estado",p:85,tags:["Nexo causal","Culpa de la víctima"],w:"Reconoce la falla por falta de señalización, pero no hay relación causal con el daño porque el conductor infringió normas de tránsito.",s:[80,88,79,72,86,83],rad:"15001-23-31-000-2006-02954-01 (61781)",f:"19 de marzo de 2021",mag:"Ver texto oficial",src:SRC.j},
{n:"Expediente 21516 de 2012",y:2012,c:"Consejo de Estado",p:81,tags:["Obstáculo en la vía","Perjuicio moral"],w:"Muerte de motociclista por colisión con obstáculo en la vía; analiza señalización, responsabilidad del contratista y tasación de perjuicios morales.",s:[78,82,75,74,80,79],rad:"19001-23-31-000-1998-00961-01 (21516)",f:"2012",mag:"Ver texto oficial",src:SRC.j2},
{n:"Expediente 17644 de 2010",y:2010,c:"Consejo de Estado",p:77,tags:["Culpa exclusiva de la víctima","Falta de señalización"],w:"Accidente de tránsito con falta de señalización de la vía; se examina falla del servicio frente a la culpa exclusiva de la víctima.",s:[74,79,72,70,77,75],rad:"76001-23-31-000-1996-02365-01 (17644)",f:"2010",mag:"Ver texto oficial",src:SRC.j2}];
const CASO="Una persona sufrió un accidente en una vía pública debido a la falta de señalización y busca determinar si existe responsabilidad del Estado.";
const REPOS=[["Responsabilidad del Estado por falta de señalización","28 septiembre 2026","Accidente vial sin señalización; posible falla del servicio.",2,3,5],["Daño por obra pública inconclusa","14 septiembre 2026","Peatón lesionado por excavación sin advertencia.",1,2,4],["Omisión en mantenimiento vial municipal","02 septiembre 2026","Hueco en calzada y responsabilidad del municipio.",1,1,3]];
const QS=[["¿Qué jurisprudencia existe sobre este caso?","Se hallaron 5 sentencias del Consejo de Estado, Sección Tercera, que analizan la falla del servicio por señalización deficiente. La más cercana: Sentencia 43556 de 2018."],["¿Qué sentencias consideran que existe falla del servicio?","Las sentencias 43556 (2018), 30799 (2014) y 61781 (2021) reconocen la falla por falta de señalización; en la última no se probó el nexo causal."],["¿Qué fallos fueron favorables?","La 43556 (2018) declaró responsable a Invías en 50 % y la 30799 (2014) condenó a Invías. La 61781 (2021) negó responsabilidad por falta de nexo causal."]];
let S={v:"home",i:0,tab:0,saved:{},file:0,text:"",ctx:0,ex:0,q:-1};
const $=s=>document.getElementById(s);
const go=(v,x={})=>{Object.assign(S,x,{v});render();scrollTo(0,0)};
const toast=m=>{const d=document.createElement('div');d.className='modal';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)};
const ill=`<svg viewBox="0 0 420 340" fill="none" stroke="#7a5a3c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="max-width:100%"><path d="M60 300c90-8 210-8 300 0" stroke="#b98a3e"/><path d="M210 70v210M170 280h80M150 300h120"/><circle cx="210" cy="62" r="9" stroke="#b98a3e"/><path d="M90 96c40-10 80-10 120-2 40-8 80-8 120 2"/><path d="M90 96l-42 92c8 24 76 24 84 0zM48 188h84M330 98l42 90c-8 24-76 24-84 0zM288 188h84" /><path d="M75 250l70-22 4 22-70 22zM82 262l68-20" stroke="#b98a3e"/><path d="M270 236h80v46h-80zM280 236v46M340 248h-50M340 262h-50" /><path d="M30 60c14-18 30-18 40 0M355 40c12-16 28-14 36 4M20 120c6-10 16-10 20 0" stroke="#b98a3e" stroke-width="1.6"/></svg>`;
const topnav=(a)=>`<nav class="top"><span class="l">⚖ Búsqueda de Jurisprudencia</span><span><a onclick="go('home')">Inicio</a><a onclick="go('login')">Iniciar sesión</a><a onclick="go('reg')">Registrarse</a></span></nav>`;
const srcl=s=>`<div class="src">Fuente de consulta: <a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></div>`;
const side=a=>`<aside class="side"><div class="l">⚖ Jurisprudencia</div>${[["home","Inicio"],["search","Nueva búsqueda"],["repos","Mis repositorios"],["saved","Jurisprudencias guardadas"],["docs","Mis documentos"],["profile","Perfil"]].map(([k,l])=>`<a class="${a==k?'on':''}" onclick="go('${k==='home'?'home':k}')">${l}</a>`).join("")}</aside>`;
const shell=(a,h)=>`<div class="app">${side(a)}<main class="wrap">${h}</main></div>`;
const bar=(l,v)=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${v} %</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`;

const V={
home:()=>topnav()+`<section class="hero"><div><h1>Jurisprudencia colombiana, organizada y siempre a la mano</h1><p>Encuentra sentencias, casos y decisiones relacionadas con tu investigación jurídica en un solo lugar.</p><p>Describe tu caso, analiza documentos y descubre jurisprudencia relacionada por hechos, conceptos, normas y decisiones.</p><div class="row"><button class="p" onclick="go('search')">Comenzar búsqueda</button><button onclick="go('login')">Iniciar sesión</button></div></div><div>${ill}</div></section>`,
login:()=>topnav()+`<div class="box"><h2>Bienvenido</h2><p style="color:var(--mid)">Inicio de sesión</p><input placeholder="Usuario"><input type="password" placeholder="Contraseña"><button class="p" style="width:100%;margin-top:10px" onclick="go('search')">Ingresar</button><p class="src">Prototipo: sin autenticación real</p></div>`,
reg:()=>topnav()+`<div class="box"><h2>Crear cuenta</h2><input placeholder="Nombre completo"><input placeholder="Correo"><input type="password" placeholder="Contraseña"><button class="p" style="width:100%;margin-top:10px" onclick="go('search')">Registrarse</button></div>`,
search:()=>shell('search',`<div class="top2"><div><h2>¿Qué caso quieres investigar?</h2>${S.ctx?`<span class="tag">Contexto cargado: Responsabilidad del Estado por falta de señalización</span>`:''}</div><div class="av"></div></div>
<div class="card"><textarea id="tx" rows="6" placeholder="Describe aquí tu caso detalladamente…">${S.text}</textarea>
${S.file?`<div class="card" style="background:var(--soft)">📄 <b>Sentencia_43556-2018.pdf</b><br><span class="src">34 páginas · Documento cargado correctamente · <span class="demo">Ejemplo de demostración</span></span><div class="row"><button class="g" onclick="go('proc')">Analizar documento</button></div></div>`:`<div class="drop" ondragover="event.preventDefault()" ondrop="event.preventDefault();go('search',{file:1,text:tx.value})">Arrastra aquí un archivo</div>`}
<div class="row"><button class="p" onclick="S.text=tx.value;go('proc')">Analizar caso</button><button onclick="go('search',{file:1,text:tx.value})">Subir PDF</button><button onclick="go('search',{file:1,text:tx.value})">Subir documento</button></div></div>
<div class="card" style="border-color:var(--gold)"><b>¿Quieres probar un caso de ejemplo?</b><div class="row"><button class="g" onclick="go('search',{text:CASO})">Usar caso de demostración</button></div></div>`),
proc:()=>{setTimeout(()=>{const st=document.querySelectorAll('.st');st.forEach((e,i)=>setTimeout(()=>e.classList.add('on'),i*500+300));setTimeout(()=>{if(S.v=='proc'){$('dn').style.display='block'}},7*500+500)},30);
return shell('search',`<div class="top2"><h2>Procesamiento</h2><div class="av"></div></div><div class="card"><h3>Analizando tu caso…</h3>${["Extrayendo información","Identificando hechos","Identificando conceptos jurídicos","Analizando normas","Analizando pruebas","Comparando jurisprudencia","Buscando sentencias relacionadas"].map(x=>`<div class="st"><span>✓</span>${x}</div>`).join("")}<div id="dn" style="display:none;margin-top:14px"><h3>Análisis completado</h3><button class="p" onclick="go('res')">Ver resultados</button></div></div>`)},
res:()=>shell('search',`<div class="top2"><div><h2>Jurisprudencia relacionada con tu caso</h2><p style="color:var(--mid)">Encontramos casos relacionados por hechos, conceptos jurídicos, normas, pruebas y decisiones.</p></div><div class="av"></div></div>
<b>${R.length} jurisprudencias encontradas</b> <span class="demo">demostración: 5 sentencias verificadas</span>
<div class="flt" style="margin:12px 0">${["Corte","Año","Tema","Magistrado","Norma","Tipo de proceso","Nivel de relación"].map(f=>`<select onchange="toast('Filtro de demostración')"><option>${f}</option><option>Todos</option></select>`).join("")}</div>
${R.map((r,i)=>`<div class="card acc" onclick="this.classList.toggle('open')"><div class="h"><div><div class="serif" style="font-size:22px;font-weight:700;text-transform:uppercase">${r.n}</div><div class="src">${r.c}</div></div><div class="pct">${r.p} % ▾</div></div><div class="b"><p>Relacionada por similitud en los hechos, problema jurídico y criterios utilizados en la decisión.</p><p>${r.w}</p>${r.tags.map(t=>`<span class="tag">${t}</span>`).join("")}<div class="row"><button class="p" onclick="event.stopPropagation();go('det',{i:${i},tab:0})">Ver jurisprudencia</button></div></div></div>`).join("")}`),
det:()=>{const r=R[S.i],T=["SIMILITUDES","RESUMEN","ANÁLISIS","SENTENCIAS RELACIONADAS"];
const L=["Similitud de hechos","Problema jurídico","Normas","Pruebas","Argumentos","Fallo"];
const tabs=[
`<h3>¿Por qué esta jurisprudencia está relacionada?</h3><div class="card">${L.map((l,k)=>bar(l,r.s[k])).join("")}<p>${e(r.why)}</p><span class="src">Estimado por IA a partir del texto de tu caso: es orientación, no un dictamen jurídico.</span></div>`,
`<div class="card"><h3>Resumen</h3>${e(r.w)}</div><p class="src">Resumen generado por IA a partir de la fuente consultada; verifique en el texto oficial.</p>`,
anTab(),
`${R.map((x,k)=>k==S.i?'':`<div class="card"><div class="top2"><div><h3 style="margin:0">${x.n}</h3><div class="src">${x.c} · ${x.y} · Tema: ${x.tags[0]}</div><p>${x.w}</p>${srcl(x.src)}</div><div class="pct">${x.p} %</div></div><button onclick="go('det',{i:${k},tab:0})">Abrir</button></div>`).join("")}`];
return shell('search',`<button onclick="go('res')">← Resultados</button><div class="top2" style="margin-top:14px"><div><h2>${r.n}</h2><div class="src">Corte: ${r.c} · Fecha: ${r.f} · Ponente: ${r.mag}<br>Radicado: ${r.rad} · Tipo de proceso: ${M.t}</div>${srcl(r.src)}</div><div class="av"></div></div>
<div class="row"><button class="${S.saved[S.i]?'g':''}" onclick="S.saved[S.i]=!S.saved[S.i];toast(S.saved[S.i]?'Guardada':'Quitada');render()">${S.saved[S.i]?'✓ Guardada':'Guardar'}</button><button onclick="window.open('${r.src[1]}','_blank')">Ver documento</button><button onclick="toast('Descarga de demostración')">Descargar</button><button onclick="toast('Enlace copiado (demo)')">Compartir</button></div>
<div class="tabs">${T.map((t,k)=>`<b class="${S.tab==k?'on':''}" onclick="S.tab=${k};render()">${t}</b>`).join("")}</div>${tabs[S.tab]}<div class="row"><button class="p" onclick="go('repos')">Guardar en Mis repositorios</button></div>`)},
repos:()=>shell('repos',`<div class="top2"><div><h2>Mis repositorios</h2><p style="color:var(--mid)">Tus investigaciones jurídicas <span class="demo">Ejemplo de demostración</span></p></div><div class="av"></div></div><div class="grid">${REPOS.map((x,k)=>`<div class="card"><h3>${x[0]}</h3><div class="src">${x[1]}</div><p>${x[2]}</p><p class="src">${x[3]} documentos · ${x[4]} consultas · ${x[5]} jurisprudencias encontradas<br>Último análisis: ${x[1]}</p><button class="p" onclick="go('exp')">Abrir investigación</button></div>`).join("")}</div>`),
exp:()=>shell('repos',`<button onclick="go('repos')">← Repositorios</button><h2 style="margin-top:14px">Expediente: Responsabilidad del Estado por falta de señalización</h2>
<div class="grid"><div class="card"><h3>Información proporcionada</h3><p>${CASO}</p></div><div class="card"><h3>Documentos</h3>📄 Sentencia_43556-2018.pdf · 34 págs.<br>📄 Relato_de_los_hechos.pdf <span class="demo">demo</span></div><div class="card"><h3>Resultados</h3>5 jurisprudencias.<br><button onclick="go('res')">Ver resultados</button></div><div class="card"><h3>Análisis</h3>El problema central es la falla del servicio por omisión en la señalización; la sentencia más cercana es la 43556 de 2018 (Consejo de Estado).</div></div>
<div class="card"><h3>Historial de consultas</h3>${QS.map((q,k)=>`<div class="q" onclick="S.q=S.q==${k}?-1:${k};render()"><b>${q[0]}</b>${S.q==k?`<p style="color:var(--mid)">${q[1]}</p>`:''}</div>`).join("")}<div class="row"><button class="p" onclick="go('search',{text:CASO,ctx:1})">Continuar investigación</button></div></div>`),
saved:()=>shell('saved',`<h2>Jurisprudencias guardadas</h2>${R.map((r,i)=>S.saved[i]?`<div class="card"><h3>${r.n}</h3>${r.c}<div class="row"><button onclick="go('det',{i:${i},tab:0})">Abrir</button></div></div>`:'').join('')||'<p style="color:var(--mid)">Aún no has guardado sentencias. Ábrelas desde los resultados y pulsa “Guardar”.</p>'}`),
docs:()=>shell('docs',`<h2>Mis documentos</h2><div class="card">📄 Sentencia_43556-2018.pdf · 34 páginas <span class="demo">Ejemplo de demostración</span></div>`),
profile:()=>shell('profile',`<h2>Perfil</h2><div class="card"><div class="av" style="width:64px;height:64px"></div><p><b>Usuario de demostración</b><br>Estudiante de Derecho</p><button onclick="go('home')">Cerrar sesión</button></div>`)
};

const e=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ul=a=>'<ul style="margin:6px 0;padding-left:18px">'+(a||[]).map(x=>'<li>'+e(x)+'</li>').join('')+'</ul>';
const tg=a=>(a||[]).map(t=>'<span class="tag">'+e(t)+'</span>').join('');
async function readF(f){if(!f)return;S.text=($('tx')||{}).value||S.text;toast('Leyendo '+f.name+'…');
try{let t='',pg=1;if(/\.pdf$/i.test(f.name)){const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;pg=d.numPages;for(let p=1;p<=pg;p++){const c=await(await d.getPage(p)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}}else t=await f.text();
if(t.trim().length<50)throw 0;go('search',{file:{name:f.name,pages:pg,text:t}})}catch(x){toast('No pude leer texto de ese archivo (¿PDF escaneado?)')}}
function run(){S.text=$('tx').value;if(!S.text.trim()&&!S.file)return toast('Escribe tu caso o sube un documento');S.running=0;go('proc')}
async function analyze(){const caso=((S.text||'')+'\n\n'+(S.file?S.file.text:'')).trim();
const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({caso})});
const j=await r.json();if(!r.ok)throw new Error(j.error||'Error del servidor');return j}
function apply(a){R.length=0;const k=['hechos','problema','normas','pruebas','argumentos','fallo'];(a.resultados||[]).forEach(x=>{const s=k.map(z=>Math.max(0,Math.min(100,Math.round(+(x.similitud||{})[z]||0))));R.push({n:x.nombre,y:x.anio||'',c:x.corte||'',p:Math.round(s.reduce((u,v)=>u+v,0)/6),tags:x.temas||[],w:x.resumen||'',s,why:x.por_que||'',rad:x.radicado||'—',f:x.fecha||'—',mag:x.ponente||'—',src:[x.fuente_titulo||'Fuente oficial',x.url||'#']})})}
function start(){if(S.running)return;S.running=1;let n=0;const st=document.querySelectorAll('.st');
const iv=setInterval(()=>{if(n<st.length-1)st[n++].classList.add('on')},1800);
analyze().then(a=>{clearInterval(iv);st.forEach(x=>x.classList.add('on'));S.A=a;apply(a);const d=$('dn');if(d){d.style.display='block';d.innerHTML='<h3>Análisis completado</h3><button class="p" onclick="go(\'res\')">Ver resultados</button>'}S.running=0}).catch(x=>{clearInterval(iv);S.running=0;const d=$('dn');if(d){d.style.display='block';d.innerHTML='<p style="color:#b4472f">No se pudo completar el análisis: '+e(x&&(x.message||x.code)||x)+'</p><button onclick="go(\'proc\')">Reintentar</button> <button onclick="go(\'search\')">Volver</button>'}})}
function anTab(){const A=S.A;if(!A)return'<p>Ejecuta un análisis primero.</p>';
return `<div class="grid"><div class="card"><h3>Polémica jurídica</h3>${e(A.problema)}</div><div class="card"><h3>Conceptos relacionados</h3>${tg(A.conceptos)}</div><div class="card"><h3>Sinónimos y términos equivalentes</h3>${(A.sinonimos||[]).map(x=>'<b>'+e(x.termino)+'</b> ≈ '+e((x.equivalentes||[]).join(', '))).join('<br>')}</div><div class="card"><h3>Polisemia</h3>${(A.polisemia||[]).map(x=>'<b>'+e(x.termino)+'</b>: '+e(x.sentidos)).join('<br>')||'—'}</div><div class="card"><h3>Normas relacionadas</h3>${ul(A.normas)}</div><div class="card"><h3>Pruebas identificadas</h3>${ul(A.pruebas)}</div><div class="card"><h3>Argumentos relevantes</h3>${ul(A.argumentos)}</div></div>`}
V.search=()=>shell('search',`<div class="top2"><div><h2>¿Qué caso quieres investigar?</h2>${S.ctx?'<span class="tag">Contexto cargado de la investigación anterior</span>':''}</div><div class="av"></div></div>
<div class="card"><textarea id="tx" rows="7" placeholder="Describe aquí tu caso detalladamente…">${e(S.text)}</textarea>
${S.file?`<div class="card" style="background:var(--soft)">📄 <b>${e(S.file.name)}</b><br><span class="src">${S.file.pages} páginas · ${S.file.text.length.toLocaleString()} caracteres leídos · Documento cargado correctamente</span><div class="row"><button class="g" onclick="run()">Analizar documento</button><button onclick="S.file=null;S.text=tx.value;render()">Quitar</button></div></div>`:`<div class="drop" ondragover="event.preventDefault()" ondrop="event.preventDefault();readF(event.dataTransfer.files[0])">Arrastra aquí tu PDF o TXT</div>`}
<input type="file" id="fi" accept=".pdf,.txt" style="display:none" onchange="readF(this.files[0])">
<div class="row"><button class="p" onclick="run()">Analizar caso</button><button onclick="fi.click()">Subir PDF</button><button onclick="fi.click()">Subir documento</button></div></div>
<div class="card" style="border-color:var(--gold)"><b>¿Quieres probar un caso de ejemplo?</b><div class="row"><button class="g" onclick="go('search',{text:CASO})">Usar caso de demostración</button></div></div>`);
V.proc=()=>{setTimeout(start,30);return shell('search',`<div class="top2"><h2>Procesamiento</h2><div class="av"></div></div><div class="card"><h3>Analizando tu caso…</h3>${["Extrayendo información","Identificando hechos","Identificando conceptos jurídicos","Analizando normas","Analizando pruebas","Comparando jurisprudencia","Buscando sentencias relacionadas"].map(x=>`<div class="st"><span>✓</span>${x}</div>`).join("")}<p class="src">La IA está leyendo tu caso; puede tardar unos segundos.</p><div id="dn" style="display:none;margin-top:14px"></div></div>`)};
V.res=()=>{const A=S.A;if(!A)return V.search();const O=R.map((r,i)=>i).sort((a,b)=>R[b].p-R[a].p);
return shell('search',`<div class="top2"><div><h2>Jurisprudencia relacionada con tu caso</h2><p style="color:var(--mid)">Encontramos casos relacionados por hechos, conceptos jurídicos, normas, pruebas y decisiones.</p></div><div class="av"></div></div>
<div class="card"><h3>Cómo entendió la IA tu caso</h3><p><b>Problema jurídico:</b> ${e(A.problema)}</p><b>Hechos</b>${ul(A.hechos)}<b>Conceptos</b><br>${tg(A.conceptos)}</div>
<b>${R.length} jurisprudencias encontradas</b> <span class="src">· encontradas en sitios oficiales; porcentajes estimados por IA</span>
${O.map(i=>{const r=R[i];return `<div class="card acc" onclick="this.classList.toggle('open')"><div class="h"><div><div class="serif" style="font-size:22px;font-weight:700;text-transform:uppercase">${r.n}</div><div class="src">${r.c}</div></div><div class="pct">${r.p} % ▾</div></div><div class="b"><p>${e(r.why)}</p><p class="src">${r.w}</p>${tg(r.tags)}<div class="row"><button class="p" onclick="event.stopPropagation();go('det',{i:${i},tab:0})">Ver jurisprudencia</button></div></div></div>`}).join('')}
<div class="card"><h3>Buscar más jurisprudencia en fuentes oficiales</h3><p class="src">Consultas sugeridas por la IA para las relatorías:</p>${ul(A.consultas)}<div class="row"><button onclick="window.open('https://relatoria.consejodeestado.gov.co/','_blank')">Relatoría Consejo de Estado</button><button onclick="window.open('https://www.corteconstitucional.gov.co/relatoria/','_blank')">Relatoría Corte Constitucional</button><button onclick="window.open('https://www.cortesuprema.gov.co/','_blank')">Corte Suprema</button></div></div>`)};
function render(){$('r').innerHTML=V[S.v]()}render();
</script></body></html>
